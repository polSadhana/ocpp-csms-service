# PostgreSQL configuration for production
# Use environment variables for sensitive data: OCPP_DB_URL, OCPP_DB_USERNAME, OCPP_DB_PASSWORD
spring.datasource.url=${OCPP_DB_URL:jdbc:postgresql://localhost:5432/ocpp}
spring.datasource.username=${OCPP_DB_USERNAME:ocpp_user}
spring.datasource.password=${OCPP_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
